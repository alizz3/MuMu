# Construye la app de Android de MuMu y la publica en Releases (mumu.apk).
# Solo corre cuando cambia la carpeta android/: los cambios de la web NO requieren reinstalar.
name: App de Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Llave de firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Falta el secreto KEYSTORE_B64: se compila solo para revisar, sin publicar"
            echo "FIRMA=no" >> "$GITHUB_ENV"
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mumu.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/mumu.jks" >> "$GITHUB_ENV"
            echo "FIRMA=si" >> "$GITHUB_ENV"
          fi
      - name: Construir
        working-directory: android
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ "$FIRMA" = "si" ]; then TAREA=assembleRelease; else TAREA=assembleDebug; fi
          gradle $TAREA --no-daemon --stacktrace 2>&1 | tee build.log
          if [ "$FIRMA" = "si" ]; then cp app/build/outputs/apk/release/app-release.apk mumu.apk; fi
      - name: Publicar mumu.apk
        if: env.FIRMA == 'si'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: MuMu para Android
          make_latest: true
          body: |
            Descarga **mumu.apk** desde el celular e instálala (permite "instalar apps de origen desconocido" si te lo pide).
            Versión ${{ github.run_number }}.
          files: android/mumu.apk
      - name: Guardar el registro
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-log
          name: Registro de compilación de la app
          prerelease: true
          files: android/build.log
