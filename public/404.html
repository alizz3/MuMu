<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Página no encontrada · MuMu</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="/favicon-32.png" />
<style>
  :root { --bg: #FFF8F6; --fg: #4A3F4C; --muted: #75667A; --accent: #A84268; --card: #fff; --line: #F1E3EA; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1E1822; --fg: #F6EAF0; --muted: #A796A8; --accent: #FFB3CB; --card: #2A222E; --line: #3E3344; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 Poppins, system-ui, sans-serif; padding: 32px 16px; }
  main { max-width: 680px; margin: 0 auto; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px; }
  h1 { margin-top: 0; font-size: 26px; } h2 { font-size: 18px; margin-top: 28px; color: var(--accent); }
  p, li { color: var(--fg); } small { color: var(--muted); } a { color: var(--accent); }
</style>
</head>
<body>
<main style="text-align:center">
  <img src="/icons/icon-192.png" width="120" height="120" alt="La vaquita de MuMu, confundida" style="border-radius:28px" />
  <h1>Ups, esta página no existe 🐮</h1>
  <p>La vaquita buscó por toda la casita y no la encontró.</p>
  <p><a href="/" style="display:inline-block;margin-top:8px;padding:12px 22px;border-radius:14px;background:#A84268;color:#fff;text-decoration:none;font-weight:600">Volver al inicio</a></p>
</main>
</body>
</html>
